<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strange Attractors · Interactive</title>
<meta name="description" content="Interactive companion to the Strategy 3 presentation: chaos theory, permutation entropy, recurrence and a multi-factor strategy on China A-shares, 2018-2025.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE; --card:rgba(250,249,246,.93); --ink:#141413; --ink2:#3d3c38; --muted:#77746C; --rule:#D6D2C7;
  --accent:#2E5A4C; --warn:#A6553A; --gold:#A9803A;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --sg:#8f8c83; --sx:#c9c5ba;
  --serif:"Instrument Serif","Noto Serif SC","Songti SC","STSong",Georgia,serif;
  --sans:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,"PingFang SC","Microsoft YaHei",monospace;
  --body:var(--sans);
}
html[data-mode="dark"]{
  --bg:#111110; --card:rgba(22,22,20,.93); --ink:#E7E4DB; --ink2:#c9c6bc; --muted:#9a978e; --rule:#34322E;
  --accent:#9CCFB2; --warn:#E08A64; --gold:#E0B663;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --sg:#8c8a82; --sx:#4a4842;
  --body:var(--mono);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html[data-mode="dark"] body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:32px 32px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none}
#labels *{pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:18px;padding:14px 20px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand .name{font-family:var(--serif);font-size:26px;letter-spacing:.2px}
html[data-mode="dark"] .brand .name{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.5px}
.brand .sub{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none;max-width:62vw}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap;color:var(--ink2)}
.tabs button .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs button[aria-selected="true"] .n{color:var(--bg);opacity:.7}
.seg{display:flex;background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 10px;font-size:12px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.toggles{display:flex;gap:8px}

/* panel */
.panel{position:fixed;z-index:4;top:74px;right:20px;bottom:20px;width:380px;background:var(--card);border:1px solid var(--rule);
  border-radius:16px;display:flex;flex-direction:column;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.06)}
.panel .scroll{overflow-y:auto;padding:20px 22px 10px;flex:1}
.panel h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1;margin:2px 0 10px}
html[data-mode="dark"] .panel h2{font-family:var(--mono);font-size:19px;font-weight:700}
.panel .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.lede{font-size:14px;line-height:1.55;color:var(--ink2);margin:0 0 14px}
.note{font-size:12.5px;line-height:1.55;color:var(--muted);margin:14px 0 6px;border-top:1px solid var(--rule);padding-top:12px}
.ctl{margin:12px 0}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px;gap:8px}
.ctl output,.mono{font-family:var(--mono);font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--accent);height:22px;margin:0}
select{width:100%;font:inherit;font-size:13px;padding:8px 10px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{border:1px solid var(--rule);background:var(--bg);border-radius:999px;padding:8px 13px;font-size:13px}
.btn:hover{border-color:var(--ink2)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--rule);background:var(--bg);border-radius:999px;padding:6px 10px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.stat{border:1px solid var(--rule);border-radius:12px;padding:9px 11px;background:var(--bg)}
.stat .k{font-size:11.5px;color:var(--muted);line-height:1.3}
.stat .v{font-family:var(--mono);font-size:19px;margin-top:3px;font-variant-numeric:tabular-nums}
.stat.wide{grid-column:1/-1}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0}
table.t th{font-weight:500;color:var(--muted);text-align:right;padding:5px 4px;border-bottom:1px solid var(--rule);font-size:11.5px}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.t td:first-child{font-family:var(--body);font-size:12.5px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.dash{height:3px;border-radius:2px;vertical-align:3px;width:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin:8px 0}
.cap{font-size:11.5px;color:var(--muted);margin-top:4px}
canvas.spark{width:100%;height:84px;display:block;border:1px solid var(--rule);border-radius:10px;background:var(--bg)}
.credits{font-size:11px;color:var(--muted);line-height:1.5;padding:10px 22px 14px;border-top:1px solid var(--rule)}
.credits a{color:inherit}
.collapse{display:none}

/* labels in the scene */
.lbl{font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap;background:color-mix(in srgb,var(--bg) 78%,transparent);padding:1px 5px;border-radius:5px}
.lbl.big{font-family:var(--body);font-size:13px;color:var(--ink);font-weight:500}
.lbl .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.glyph{display:flex;flex-direction:column;align-items:center;gap:2px}
.glyph svg{display:block}

.dock{position:fixed;z-index:4;left:20px;bottom:20px;display:flex;gap:8px}
.hint{position:fixed;z-index:3;left:50%;bottom:24px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:var(--card);
  border:1px solid var(--rule);border-radius:999px;padding:7px 14px;transition:opacity .8s;white-space:nowrap}
.tip{position:fixed;z-index:6;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;padding:8px 10px;
  border-radius:10px;max-width:280px;opacity:0;transition:opacity .12s;font-family:var(--body)}
.tip b{font-weight:600}
.tip .m{font-family:var(--mono)}

@media (max-width:760px){
  .topbar{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .brand .sub{display:none}
  .brand .name{font-size:21px}
  .tabs{order:3;max-width:100%;width:100%;margin-left:0}
  .toggles{margin-left:auto}
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:46vh;border-radius:16px 16px 0 0;border-bottom:0}
  .panel.collapsed{height:52px}
  .panel.collapsed .scroll,.panel.collapsed .credits{display:none}
  .collapse{display:block;position:absolute;top:-38px;right:12px;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12px}
  .dock{display:none}
  .hint{bottom:auto;top:112px;white-space:normal;text-align:center;width:max-content;max-width:calc(100vw - 24px)}
}
</style>

    for (let i = 1; i < ends.length; i++) ends[i].position.y = Math.max(ends[i].userData.y, ends[i-1].position.y + 0.17);
    const gp = []; this.gridLbl.forEach(l => this.chart.remove(l)); this.gridLbl = [];
    for (let e = Math.ceil(this.yr[0]); e <= Math.floor(this.yr[1]); e++) { const y = this.yOf(2**e); gp.push(-this.W/2, y, -0.01, this.W/2, y, -0.01);
      const l = label(`×${2**e >= 1 ? 2**e : '1/' + 2**(-e)}`); l.position.set(-this.W/2 - 0.05, y, 0); l.center.set(1, 0.5); this.gridLbl.push(l); this.chart.add(l); }
    this.grid.geometry.dispose(); this.grid.geometry = new THREE.BufferGeometry(); this.grid.geometry.setAttribute('position', new THREE.Float32BufferAttribute(gp, 3));
    this.grid.material.color.set(c.rule);
    this.yearLbl.forEach(l => l.position.y = -this.HH/2 - 0.18);
    this.bands.forEach(({ m, l }) => { const x0 = this.xOf(m.userData.i0), x1 = this.xOf(m.userData.i1); m.scale.set(x1 - x0, this.HH, 1); m.position.set((x0+x1)/2, 0, -0.05);
      m.material.color.set(c.rule); l.position.set(x0 + 0.05, this.HH/2 + 0.12, 0); l.center.set(0, 0.5); l.element.innerHTML = t(l.userData.key); });
    this.cross.material.color.set(c.ink); this.cross.scale.y = this.HH/2;
  },
  table(){ const el = $('#t5tab'); if (!el) return; const base = Object.fromEntries(this.data.map(d => [d.k, d]));
    const ls = this.mode === 'ls';
    el.innerHTML = `<tr><th>${t('t5.series')}</th><th>${ls ? t('t5.ret') : t('t5.cagr')}</th><th>${t('t5.sharpe')}</th><th>${t('t5.dd')}</th>${ls ? '' : `<th>${t('t5.vs')}</th>`}</tr>` +
      this.data.map(d => { let vs = '';
        if (!ls && d.vs) { const b = base[d.vs]; const n = d.r.length, br = b.r.slice(d.off - b.off, d.off - b.off + n); const bp = perf(br); vs = pct(d.perf.cagr - bp.cagr); }
        return `<tr><td><span class="sw ${d.dash ? 'dash' : ''}" style="background:var(--${d.c})"></span>${t('p.'+d.k)}</td><td>${pct(ls ? d.perf.ann : d.perf.cagr)}</td><td>${num(d.perf.sharpe)}</td><td>${pct(d.perf.dd, 1, false)}</td>${ls ? '' : `<td>${vs}</td>`}</tr>`; }).join('');
    $('#t5note').textContent = t('t5.note.' + this.mode); },
  recolor(){ if (this.data) this.draw(); },
  relabel(){ if (this.data) this.draw(); },
  pick(ray){ const hit = ray.intersectObject(this.hit)[0]; if (!hit) { this.cross.visible = false; return null; }
    const lx = this.chart.worldToLocal(hit.point.clone()).x, i = clamp(Math.round((lx + this.W/2)/this.W*(ND-1)), 0, ND-1);
    this.cross.visible = true; this.cross.position.x = this.xOf(i);
    const rows = this.data.filter(d => i >= d.off).map(d => `<span class="sw" style="background:var(--${d.c})"></span>${t('p.'+d.k)}: <span class="m">${d.nav[Math.min(i - d.off, d.nav.length-1)].toFixed(2)}</span>`);
    return `<b class="m">${P.dates[i]}</b><br>${rows.join('<br>')}`; },
  leave(){ if (this.cross) this.cross.visible = false; },
  panel(){ return `<div class="seg" style="display:inline-flex;margin-bottom:6px" id="t5mode">${['ls','long','enh'].map(m => `<button data-m="${m}" aria-pressed="${m === this.mode}">${t('t5.'+m)}</button>`).join('')}</div>
      <div class="ctl"><div class="row"><span>${t('t5.cost')}</span><output id="o_cost"></output></div><input type="range" id="cost" min="0" max="0.6" step="0.01" value="${this.cost}" list="costTicks">
      <datalist id="costTicks"><option value="0.12"></option><option value="0.36"></option></datalist>
      <div class="cap">▲ ${t('t5.tested')} · ▲ ${t('t5.real')}</div></div>
      <table class="t" id="t5tab"></table>
      <p class="note" id="t5note"></p>`; },
  bind(){ const s = $('#cost'), o = $('#o_cost'); o.textContent = this.cost.toFixed(2) + '%'; let pend = false;
    s.oninput = () => { this.cost = +s.value; o.textContent = this.cost.toFixed(2) + '%'; if (!pend) { pend = true; requestAnimationFrame(() => { pend = false; this.refresh(); }); } };
    document.querySelectorAll('#t5mode button').forEach(b => b.onclick = () => { this.mode = b.dataset.m; document.querySelectorAll('#t5mode button').forEach(x => x.setAttribute('aria-pressed', x === b)); this.refresh(); });
    this.table(); },
  enter(){ this.refresh(); },
};

/* ======================================================================= TAB 6: overfitting */
const OURS = [{ k:'t6.r1', s:1.38, y:7.8, single:false, c:'s1' }, { k:'t6.r2', s:0.74, y:3, single:false, c:'s1' },
              { k:'t6.r3', s:3.27, y:7.8, single:true, c:'s2' }, { k:'t6.r4', s:3.62, y:2.33, single:true, c:'s3' }];
const T6 = {
  group: new THREE.Group(), view: { target: [0, 0.15, 0], dir: [0.02, 0.05, 1], rx: 4.55, ry: 2.15 },
  N: 35, years: 7.8, seed: 1, SX: [-4.2, -0.4], HX: [0.4, 4.2], SMIN: -2, SMAX: 4.5,
  build(){
    this.paths = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ transparent: true, opacity: 0.35 }));
    this.best = fatLine([0,0,0,1,0,0], fatMat({ linewidth: 2.6 }));
    this.hist = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.7 }), 40); this.hist.count = 0;
    this.axis = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial());
    this.marks = OURS.map(o => { const l = fatLine([0,-1.6,0,0,1.6,0], fatMat({ linewidth: 2, dashed: true, dashSize: 0.06, gapSize: 0.05 })); const lb = label(''); return { o, l, lb }; });
    this.mBest = fatLine([0,-1.6,0,0,1.6,0], fatMat({ linewidth: 2.4 })); this.lBest = label(''); this.lExp = label('');
    this.mExp = fatLine([0,-1.6,0,0,1.6,0], fatMat({ linewidth: 1.4, dashed: true, dashSize: 0.03, gapSize: 0.05 }));
    this.lPaths = label('', 'lbl big'); this.lPaths.position.set((this.SX[0]+this.SX[1])/2, 2.05, 0);
    this.lHist = label('', 'lbl big'); this.lHist.position.set((this.HX[0]+this.HX[1])/2, 2.05, 0);
    this.tick = []; for (let s = -2; s <= 4; s++) { const l = label(String(s)); l.position.set(this.hx(s), -1.82, 0); this.tick.push(l); }
    this.group.add(this.paths, this.best, this.hist, this.axis, ...this.marks.flatMap(m => [m.l, m.lb]), this.mBest, this.lBest, this.mExp, this.lExp, this.lPaths, this.lHist, ...this.tick);
    this.roll();
  },
  hx(s){ return this.HX[0] + (this.HX[1]-this.HX[0])*(s - this.SMIN)/(this.SMAX - this.SMIN); },
  roll(){
    const r = rng(this.seed*1009 + this.N*13), days = Math.round(this.years*243), sd = 0.06/Math.sqrt(243), step = Math.max(1, Math.round(days/260));
    const all = [], sh = [];
    for (let k = 0; k < this.N; k++) { let v = 0, s = 0, s2 = 0; const path = [0];
      for (let d = 1; d <= days; d++) { const x = gauss(r)*sd; s += x; s2 += x*x; v += Math.log2(1+x); if (d % step === 0) path.push(v); }
      const mu = s/days; sh.push(mu/Math.sqrt(s2/days - mu*mu)*Math.sqrt(243)); all.push(path); }
    this.sh = sh; this.bi = sh.indexOf(Math.max(...sh)); this.all = all; this.draw(); this.stats();
  },
  draw(){
    const c = C(), [x0, x1] = this.SX, lim = 1.2, ys = 1.6/lim, seg = [];
    const px = (j, L) => x0 + (x1-x0)*j/(L-1), py = v => clamp(v, -lim, lim)*ys;
    this.all.forEach((p, k) => { if (k === this.bi) return; for (let j = 1; j < p.length; j++) seg.push(px(j-1, p.length), py(p[j-1]), 0, px(j, p.length), py(p[j]), 0); });
    this.paths.geometry.dispose(); this.paths.geometry = new THREE.BufferGeometry(); this.paths.geometry.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
    this.paths.material.color.set(c.sg);
    const bp = this.all[this.bi]; setFat(this.best, bp.flatMap((v, j) => [px(j, bp.length), py(v), 0.02])); this.best.material.color.set(c.ink);
    const bins = new Array(26).fill(0), bw = 0.25; this.sh.forEach(s => { const b = Math.floor((s - this.SMIN)/bw); if (b >= 0 && b < 26) bins[b]++; });
    const mx = Math.max(...bins, 1), m = new THREE.Matrix4(), q = new THREE.Quaternion(), w = (this.HX[1]-this.HX[0])*bw/(this.SMAX - this.SMIN);
    bins.forEach((n, b) => { const h = Math.max(n/mx*2.6, 0.004); m.compose(new THREE.Vector3(this.hx(this.SMIN + (b+0.5)*bw), -1.6 + h/2, 0), q, new THREE.Vector3(w*0.85, h, 0.25)); this.hist.setMatrixAt(b, m); this.hist.setColorAt(b, new THREE.Color(c.sg)); });
    this.hist.count = 26; this.hist.instanceMatrix.needsUpdate = true; this.hist.instanceColor.needsUpdate = true; this.hist.material.color.set('#ffffff');
    this.axis.geometry.dispose(); this.axis.geometry = new THREE.BufferGeometry();
    this.axis.geometry.setAttribute('position', new THREE.Float32BufferAttribute([this.HX[0], -1.6, 0, this.HX[1], -1.6, 0, x0, 0, -0.01, x1, 0, -0.01], 3)); this.axis.material.color.set(c.muted);
    const put = (line, lb, s, col, txt, row) => { const x = this.hx(clamp(s, this.SMIN, this.SMAX)); line.position.x = x; line.material.color.set(col); lb.position.set(x, 1.62 - row*0.2, 0.05); lb.center.set(0, 0.5); lb.element.innerHTML = txt; };
    const best = this.sh[this.bi], exp = Math.sqrt(2*Math.log(Math.max(this.N, 1)))/Math.sqrt(this.years);
    put(this.mBest, this.lBest, best, c.ink, `${t('t6.bestl')} ${num(best)}`, 0);
    put(this.mExp, this.lExp, exp, c.muted, `${t('t6.expl')} ${num(exp)}`, 1);
    this.marks.forEach(({ o, l, lb }, i) => put(l, lb, o.s, c[o.c], `<span class="dot" style="background:var(--${o.c})"></span>${num(o.s)}`, 2 + i));
  },
  stats(){ if (!$('#t6best')) return; $('#t6best').textContent = num(this.sh[this.bi]); $('#t6exp').textContent = num(Math.sqrt(2*Math.log(Math.max(this.N,1)))/Math.sqrt(this.years));
    $('#t6tab').innerHTML = `<tr><th>${t('t6.ours')}</th><th>${t('t5.sharpe')}</th><th>${t('t6.p')}</th></tr>` +
      OURS.map(o => `<tr><td><span class="sw" style="background:var(--${o.c})"></span>${t(o.k)}</td><td>${num(o.s)}</td><td>${fmtChance(chanceBestReaches(o.s, o.y, o.single ? 1 : this.N))}</td></tr>`).join(''); },
  recolor(){ if (this.sh) this.draw(); }, relabel(){ this.lPaths.element.innerHTML = t('t6.paths'); this.lHist.element.innerHTML = t('t6.hist'); if (this.sh) this.draw(); },
  panel(){ return `<div class="ctl"><div class="row"><span>${t('t6.n')}</span><output id="o_N"></output></div><input type="range" id="N" min="1" max="200" step="1" value="${this.N}"></div>
      <div class="ctl"><div class="row"><span>${t('t6.years')}</span><output id="o_Y"></output></div><input type="range" id="Y" min="1" max="10" step="0.1" value="${this.years}"></div>
      <div class="btnrow"><button class="btn" id="reroll">${t('t6.reroll')}</button></div>
      <div class="stats"><div class="stat"><div class="k">${t('t6.best')}</div><div class="v" id="t6best">–</div></div>
      <div class="stat"><div class="k">${t('t6.exp')}</div><div class="v" id="t6exp">–</div></div></div>
      <table class="t" id="t6tab"></table><p class="note">${t('t6.note')}</p>`; },
  bind(){ const n = $('#N'), y = $('#Y'); $('#o_N').textContent = this.N; $('#o_Y').textContent = this.years.toFixed(1); let pend = false;
    const go = () => { if (!pend) { pend = true; requestAnimationFrame(() => { pend = false; this.roll(); }); } };
    n.oninput = () => { this.N = +n.value; $('#o_N').textContent = this.N; go(); };
    y.oninput = () => { this.years = +y.value; $('#o_Y').textContent = this.years.toFixed(1); go(); };
    $('#reroll').onclick = () => { this.seed++; this.roll(); }; this.stats(); },
};

/* ======================================================================= app shell */
const TABS = [T1, T2, T3, T4, T5, T6];
let cur = null, curIdx = -1;
function applyStatic(){
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  $('#tabs').innerHTML = TABS.map((_, i) => `<button role="tab" data-i="${i}" aria-selected="${i === curIdx}"><span class="n">0${i+1}</span>${t('tab.'+(i+1))}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(+b.dataset.i));
  document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === MODE));
  document.title = `${t('brand.name')} · Interactive`;
}
function renderPanel(){
  const i = curIdx + 1;
  $('#panelBody').innerHTML = `<div class="kicker">${t('kicker', { n: i })}</div><h2>${t('t'+i+'.title')}</h2><p class="lede">${t('t'+i+'.lede')}</p>${cur.panel()}`;
  cur.bind?.(); $('#panelBody').scrollTop = 0;
}
function setTab(i, instant=false){
  if (i === curIdx) return;
  if (cur) { cur.leave?.(); scene.remove(cur.group);
    // three.js only detaches labels of the removed object itself; drop the nested ones too (re-attached on render)
    cur.group.traverse(o => { if (o.isCSS2DObject) o.element.remove(); }); }
  curIdx = i; cur = TABS[i];
  if (!cur.built) { cur.build(); cur.built = true; }
  scene.add(cur.group); cur.recolor?.(); cur.relabel?.(); cur.enter?.();
  applyStatic(); renderPanel(); flyTo(viewOf(cur), instant);
  history.replaceState(null, '', `?lang=${LANG}#${i+1}`);
}
function setLang(l){ LANG = l; store.set('sa.lang', l); applyStatic(); renderPanel(); TABS.forEach(T => T.built && T.relabel?.()); history.replaceState(null, '', `?lang=${LANG}#${curIdx+1}`); }
function setMode(m){ MODE = m; store.set('sa.mode', m); document.documentElement.dataset.mode = m; applyStatic(); TABS.forEach(T => T.built && T.recolor?.()); if (curIdx === 0) T1.stats(0); }
document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('#spin').onclick = e => { controls.autoRotate = !controls.autoRotate; e.currentTarget.setAttribute('aria-pressed', controls.autoRotate); };
$('#reset').onclick = () => flyTo(viewOf(cur));
$('#collapse').onclick = () => { $('#panel').classList.toggle('collapsed'); resize(); flyTo(viewOf(cur)); };
addEventListener('keydown', e => { if (e.target.matches('input,select,textarea')) return;
  if (e.key >= '1' && e.key <= '6') setTab(+e.key - 1); else if (e.key === 'm' || e.key === 'M') setMode(MODE === 'light' ? 'dark' : 'light');
  else if (e.key === 'l' || e.key === 'L') setLang(LANG === 'en' ? 'zh' : 'en'); });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tip = $('#tip');
let pointer = null;
canvas.addEventListener('pointermove', e => { pointer = e; });
canvas.addEventListener('pointerleave', () => { pointer = null; tip.style.opacity = 0; cur?.leave?.(); });
function hover(){
  if (!pointer || !cur?.pick) { tip.style.opacity = 0; return; }
  ndc.set(pointer.clientX/innerWidth*2 - 1, -(pointer.clientY/innerHeight)*2 + 1); ray.setFromCamera(ndc, camera);
  const html = cur.pick(ray);
  if (!html) { tip.style.opacity = 0; return; }
  tip.innerHTML = html; tip.style.opacity = 1;
  const x = Math.min(pointer.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(pointer.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

document.documentElement.dataset.mode = MODE;
applyStatic(); resize();
const start = clamp((parseInt(location.hash.slice(1)) || 1) - 1, 0, 5);
setTab(start, true);
setTimeout(() => $('#hint').style.opacity = 0, 6000);

const clock = new THREE.Clock();
let hoverTick = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (fly) { fly.k = Math.min(1, fly.k + dt/0.9); const e = fly.k < 0.5 ? 4*fly.k**3 : 1 - (-2*fly.k + 2)**3/2;
    camera.position.lerpVectors(fly.p0, fly.p, e); controls.target.lerpVectors(fly.t0, fly.t, e); if (fly.k >= 1) fly = null; }
  cur?.update?.(dt);
  controls.update();
  if (++hoverTick % 3 === 0) hover();
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
});
</script>
